<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product != null and product.productId != null ? 'Edit Product | Admin' : 'New Product | Admin'}">Product | Admin</title>
    <link rel="stylesheet" th:href="@{/css/admin/dashboard.css}">
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <div class="brand">
            <span class="brand-icon">☕</span>
            <span>Midnight Admin</span>
        </div>
        <nav class="nav">
            <a th:href="@{/admin}">
                <span>📊</span>
                <span>Dashboard</span>
            </a>
            <a th:href="@{/admin/products}" class="active">
                <span>🥐</span>
                <span>Products</span>
            </a>
            <a th:href="@{/admin/customers}">
                <span>👥</span>
                <span>Customers</span>
            </a>
            <a th:href="@{/admin/employees}">
                <span>💼</span>
                <span>Employees</span>
            </a>
            <a th:href="@{/admin/load-test}">
                <span>⚡</span>
                <span>Load Tests</span>
            </a>
        </nav>
        <div class="sidebar-footer">
            <a th:href="@{/}">
                <span>←</span>
                <span>Back to Storefront</span>
            </a>
        </div>
    </aside>

    <main class="content">
        <header class="page-header">
            <div>
                <h1 th:text="${product != null and product.productId != null ? 'Edit Product' : 'Add New Product'}">Add Product</h1>
                <p>Configure product details, category, pricing, and description.</p>
            </div>
            <a class="button button-secondary" th:href="@{/admin/products}">← Back to Products</a>
        </header>

        <div class="form-container">
            <form th:action="${product != null and product.productId != null ? '/admin/products/' + product.productId : '/admin/products'}"
                  method="post">

                <div class="form-group">
                    <label for="name">Product Name <span class="required">*</span></label>
                    <input type="text"
                           id="name"
                           name="name"
                           required
                           maxlength="255"
                           th:value="${product != null ? product.name : ''}"
                           placeholder="e.g. Midnight Mocha, Aurora Croissant">
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="category">Category <span class="required">*</span></label>
                        <select id="category" name="category" required>
                            <option th:each="cat : ${categories}"
                                    th:value="${cat.name()}"
                                    th:text="${cat.displayName}"
                                    th:selected="${product != null and product.category != null and product.category.name() == cat.name()}">
                                Beverage
                            </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="price">Price ($) <span class="required">*</span></label>
                        <input type="number"
                               id="price"
                               name="price"
                               required
                               min="0"
                               step="0.01"
                               th:value="${product != null ? product.price : '0.00'}"
                               placeholder="4.50">
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description"
                              name="description"
                              maxlength="2000"
                              placeholder="Describe the flavors, ingredients, roast, or notes..."
                              th:text="${product != null ? product.description : ''}"></textarea>
                    <div class="form-hint">Displayed on storefront cards and product view pages.</div>
                </div>

                <div class="form-actions">
                    <a class="button button-secondary" th:href="@{/admin/products}">Cancel</a>
                    <button class="button button-primary"
                            type="submit"
                            th:text="${product != null and product.productId != null ? 'Save Changes' : 'Create Product'}">
                        Save Product
                    </button>
                </div>
            </form>
        </div>
    </main>
</div>
</body>
</html>
