<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/main :: html(
    title=~{::title},
    links=~{::links},
    content=~{::content},
    scripts=~{::scripts}
)}">
<head>
    <title>Midnight Coder | Register</title>
    <th:block th:fragment="links">
        <link rel="stylesheet" th:href="@{/css/auth/register.css}">
    </th:block>
</head>
<body>
    <div th:fragment="content">
        <div class="register-container">
            <h2>Join <span>Midnight</span></h2>
            <div th:if="${param.error}" class="error-message" th:text="${param.error}">
                Registration failed.
            </div>
            <form th:action="@{/api/auth/register}" method="post">
                <div class="form-group">
                    <label for="identity">Nickname</label>
                    <input type="text" id="identity" name="identity" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="form-group">
                    <label for="rePassword">Re-Password</label>
                    <input type="password" id="rePassword" name="rePassword" required>
                </div>
                <button type="submit" class="btn btn-primary register-btn">Register</button>
            </form>
            <div class="oauth-divider">
                <span>OR</span>
            </div>
            <a th:href="@{/oauth2/authorization/github}" class="btn btn-github">
                <svg class="github-icon" height="20" width="20" viewBox="0 0 16 16" fill="currentColor">
                    <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
                </svg>
                <span>Sign up with GitHub</span>
            </a>
            <div class="auth-footer">
                Already have an account? <a th:href="@{/login}">Login here</a>
            </div>
        </div>
    </div>

    <th:block th:fragment="scripts">
    </th:block>
</body>
</html>
