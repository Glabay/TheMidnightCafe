<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="en"
      th:fragment="html(title, links, content, scripts)">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-B9SWPD1KV3"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-B9SWPD1KV3');
    </script>

    <meta charset="UTF-8">
    <meta name="author" content="Mike Glabay">
    <meta name="robots" content="index, follow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Midnight Coder is a social platform that teaches coding skills to students.">
    <meta name="keywords" content="coding, education, learning, java, programming, community, online, platform">

    <meta property="og:title" content="Midnight Coder">
    <meta property="og:description" content="Midnight Coder is a social platform that teaches coding skills to students.">
    <meta property="og:image" content="https://midnightcoder.dev/img/TMC.png">
    <meta property="og:url" content="https://midnightcoder.dev/">
    <meta property="og:type" content="website">

    <title th:replace="${title}">Midnight Coder</title>

    <link rel="canonical" href="https://midnightcoder.dev/">
    <link rel="icon" type="image/png" th:href="@{/img/TMC.png}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/header.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/footer.css}">

    <th:block th:if="${links != null}" th:replace="${links}">
        <!-- Dynamic links from pages -->
    </th:block>
</head>
<body>
    <div class="aurora-glow"></div>
    
    <header th:replace="~{fragments/header :: header}"></header>

    <main th:insert="${content}">
        <!-- Page content goes here -->
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

    <script th:src="@{/js/main.js}"></script>
    <th:block th:if="${scripts != null}" th:insert="${scripts}" />
</body>
</html>
