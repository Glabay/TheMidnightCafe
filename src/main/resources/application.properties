spring.application.name=TheMidnightCafe
spring.profiles.active=dev

# LOGGING
logging.file.name=./data/logs/midnight_logs.log
logging.level.root=INFO
logging.level.dev.midnightcoder=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=ERROR

# JWT
jwt.issuer=midnight-coder-jwt
jwt.audience=midnight-users
jwt.access-ttl-minutes=15
jwt.clock-skew-seconds=15
jwt.secret=${JWT_SECRET}

# JWT REFRESH TOKEN
security.cookies.secure=false
jwt.refresh-ttl-days=14
refresh.pepper=${REFRESH_TOKEN_PEPPER}
security.refresh.detect-reuse=true
security.refresh.revoke-family-on-reuse=true
security.refresh.cleanup-expired=false
security.refresh.cleanup-grace-days=7

# OAUTH2 / GITHUB
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.github.scope[0]=read:user
spring.security.oauth2.client.registration.github.scope[1]=user:email
spring.security.oauth2.client.registration.github.client-name=GitHub
app.oauth2.redirect-uri=/?loginSuccess=true
app.oauth2.failure-redirect-uri=/login?error=oauth